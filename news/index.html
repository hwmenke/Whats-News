<!doctype html>
<html lang="en" data-density="regular" data-hed="franklin">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Daily Brief — News Desk Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fdfdfb; --paper-2: #f6f6f3; --dark: #121419;
    --ink: #15171b; --ink-2: #3d4148; --ink-3: #70757e; --ink-4: #a6aab1;
    --rule: #e3e4e6; --rule-2: #eeeff0;
    --accent: #2456c4;
    --up: oklch(50% 0.12 155); --down: oklch(53% 0.16 27);
    --sans: "Libre Franklin", "Helvetica Neue", Helvetica, ui-sans-serif, sans-serif;
    --serif: "Source Serif 4", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --pad: 24px; --gap: 28px; --hed-font: var(--sans); --hed-weight: 800;
  }
  html[data-density="compact"] { --pad: 16px; --gap: 18px; }
  html[data-density="comfy"]   { --pad: 32px; --gap: 40px; }
  html[data-hed="serif"] { --hed-font: var(--serif); --hed-weight: 600; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* ---------- top strap ---------- */
  .strap { background: var(--dark); color: #e8e9ec; }
  .strap-in { max-width: 1320px; margin: 0 auto; padding: 0 var(--pad); display: flex; align-items: center; gap: 18px; height: 38px; overflow: hidden; }
  .strap-date { font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; color: #c8cad0; }
  .strap-status { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #9aa0ab; white-space: nowrap; border-left: 1px solid #2b2e36; padding-left: 18px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--up); }
  .tape { flex: 1; overflow: hidden; border-left: 1px solid #2b2e36; mask-image: linear-gradient(to right, transparent, black 24px, black calc(100% - 24px), transparent); }
  .tape-track { display: flex; width: max-content; animation: tape-scroll 60s linear infinite; }
  .tape:hover .tape-track { animation-play-state: paused; }
  @keyframes tape-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .tape-track { animation: none; } }
  .tape-run { display: flex; }
  .tape-item { display: inline-flex; gap: 7px; align-items: center; padding: 0 16px; height: 38px; font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  .tape-sym { color: #9aa0ab; letter-spacing: 0.04em; }
  .tape-px { color: #e8e9ec; font-weight: 500; }
  .tape-chg.is-up { color: oklch(72% 0.13 155); }
  .tape-chg.is-down { color: oklch(72% 0.15 27); }

  /* ---------- masthead + nav ---------- */
  .mast-in { max-width: 1320px; margin: 0 auto; padding: 26px var(--pad) 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .brand { font-family: var(--sans); font-weight: 900; font-size: clamp(26px, 3.2vw, 40px); letter-spacing: -0.025em; line-height: 1; margin: 0; white-space: nowrap; }
  .brand-tag { margin: 7px 0 0; font-size: 12px; color: var(--ink-3); letter-spacing: 0.01em; }
  .mast-side { display: flex; align-items: center; gap: 14px; padding-bottom: 4px; }
  .edition { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--ink-3); }
  .btn-sub { appearance: none; font-family: var(--sans); font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border: 0; padding: 8px 14px; cursor: pointer; letter-spacing: 0.01em; }
  .btn-sub:hover { filter: brightness(1.08); }
  .nav { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
  .nav-in { max-width: 1320px; margin: 0 auto; padding: 0 var(--pad); display: flex; align-items: stretch; gap: 2px; }
  .nav-link { font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink-2); padding: 11px 12px; border-bottom: 2px solid transparent; }
  .nav-link:hover { color: var(--ink); }
  .nav-link.is-on { color: var(--ink); border-bottom-color: var(--accent); }
  .nav-spacer { flex: 1; }
  .nav-search { font-size: 12px; color: var(--ink-3); align-self: center; padding-right: 4px; }

  .main { max-width: 1320px; margin: 0 auto; padding: 0 var(--pad); }
  .kicker { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: 5fr 7fr; gap: calc(var(--gap) + 8px); padding: var(--gap) 0; border-bottom: 1px solid var(--rule); }
  .hero-hed { font-family: var(--hed-font); font-weight: var(--hed-weight); font-size: clamp(26px, 2.6vw, 38px); line-height: 1.08; letter-spacing: -0.015em; margin: 0 0 14px; text-wrap: balance; }
  .hero-dek { font-family: var(--serif); font-size: 17px; line-height: 1.55; color: var(--ink-2); margin: 0 0 10px; text-wrap: pretty; }
  .hero-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin: 0 0 22px; }
  .coverage { border-top: 1px solid var(--rule); }
  .coverage-label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 4px; }
  .coverage-link { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--rule-2); }
  .coverage-link:hover .coverage-title { color: var(--accent); }
  .coverage-src { font-size: 11px; font-weight: 700; color: var(--ink-2); }
  .coverage-title { font-family: var(--serif); font-size: 14px; color: var(--ink); }
  .coverage-min { font-family: var(--mono); font-size: 10px; color: var(--ink-4); }

  /* ---------- charts (shared) ---------- */
  .chart { margin: 0; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart-title { font-family: var(--sans); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; line-height: 1.2; margin: 0 0 4px; }
  .chart-sub { font-size: 12.5px; color: var(--ink-3); margin: 0 0 12px; line-height: 1.45; text-wrap: pretty; }
  .chart-source { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.05em; color: var(--ink-4); margin: 8px 0 0; }
  .chart-hero .chart-title { font-size: 20px; }
  .grid { stroke: var(--rule); stroke-width: 1; }
  .grid-zero { stroke: var(--ink-3); stroke-width: 1.2; }
  .tick { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-3); }
  .row-label { font-family: var(--sans); font-size: 11.5px; font-weight: 600; fill: var(--ink-2); }
  .line-accent { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
  .line-up { fill: none; stroke: var(--up); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .line-dn, .line-down { fill: none; stroke: var(--down); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .line-down { stroke-width: 2.6; }
  .line-base { fill: none; stroke: var(--ink-4); stroke-width: 1.4; opacity: 0.65; }
  .ys-inv-fill { fill: var(--down); opacity: 0.10; stroke: none; }
  .band { fill: var(--accent); opacity: 0.12; stroke: none; }
  .end-dot { fill: var(--accent); stroke: var(--paper); stroke-width: 1.5; }
  .dot-up { fill: var(--up); } .dot-dn { fill: var(--down); }
  .end-label { font-family: var(--mono); font-size: 13px; font-weight: 600; fill: var(--ink); }
  .end-label-sub { font-family: var(--mono); font-size: 10px; fill: var(--ink-3); }
  .end-label-mini { font-family: var(--mono); font-size: 11px; font-weight: 600; fill: var(--ink-2); }
  .anno-leader { stroke: var(--ink-3); stroke-width: 1; }
  .anno-dot { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
  .anno-text { font-family: var(--sans); font-size: 11.5px; fill: var(--ink-2); }
  .anno-bold { font-weight: 700; fill: var(--ink); }
  .anno-accent { fill: var(--accent); font-weight: 700; }
  .bar { fill: var(--ink-4); opacity: 0.55; }
  .bar-hot { fill: var(--accent); }
  .db-link { stroke: var(--ink-4); stroke-width: 1.6; }
  .db-before { fill: var(--ink-4); }
  .db-after { fill: var(--accent); }
  .is-up { color: var(--up); } .is-down { color: var(--down); }

  /* ---------- index strip ---------- */
  .strip { display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid var(--rule); }
  .strip-card { padding: 14px 16px 10px; border-right: 1px solid var(--rule-2); }
  .strip-card:first-child { padding-left: 0; }
  .strip-card:last-child { border-right: 0; }
  .strip-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .strip-name { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
  .strip-chg { font-family: var(--mono); font-size: 11px; font-weight: 600; }
  .strip-px { font-family: var(--mono); font-size: 19px; font-weight: 600; margin: 3px 0 2px; }
  .mini-line { display: block; width: 100%; height: auto; }

  /* ---------- data desk ---------- */
  .desk { padding: var(--gap) 0; border-bottom: 1px solid var(--rule); }
  .desk-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: calc(var(--gap) - 6px); }
  .section-hed { font-family: var(--sans); font-weight: 900; font-size: 22px; letter-spacing: -0.015em; margin: 0; padding-left: 12px; border-left: 4px solid var(--accent); }
  .section-sub { font-size: 12.5px; color: var(--ink-3); margin: 0; }
  .desk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--gap) + 6px); }
  .desk-grid .chart { border-top: 1px solid var(--ink); padding-top: 12px; }

  /* ---------- small multiples ---------- */
  .chart-sm { padding: var(--gap) 0; border-bottom: 1px solid var(--rule); display: block; }
  .sm-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; }
  .sm-panel { border-top: 1px solid var(--rule); padding-top: 8px; }
  .sm-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .sm-name { font-size: 12px; font-weight: 700; }
  .sm-chg { font-family: var(--mono); font-size: 11.5px; font-weight: 600; }

  /* ---------- story grid + rail ---------- */
  .stories { display: grid; grid-template-columns: 1fr 320px; gap: calc(var(--gap) + 10px); padding: var(--gap) 0; }
  .stories-main { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--gap) + 4px) calc(var(--gap) + 10px); align-content: start; }
  .card { border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card .kicker { margin: 0; }
  .card-hed { font-family: var(--hed-font); font-weight: var(--hed-weight); font-size: 19px; line-height: 1.18; letter-spacing: -0.01em; margin: 0; text-wrap: balance; cursor: pointer; }
  .card-hed:hover { color: var(--accent); }
  .card-dek { font-family: var(--serif); font-size: 14px; line-height: 1.5; color: var(--ink-2); margin: 0; text-wrap: pretty; }
  .card-meta { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); margin: 2px 0 0; }
  .card-src { color: var(--ink-2); font-weight: 600; }
  .rail { border-left: 1px solid var(--rule); padding-left: calc(var(--gap) - 4px); }
  .rail-hed { font-family: var(--sans); font-weight: 900; font-size: 15px; letter-spacing: 0.02em; text-transform: uppercase; margin: 0 0 6px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
  .rail-item { display: block; padding: 9px 0; border-bottom: 1px solid var(--rule-2); }
  .rail-item:hover .rail-title { color: var(--accent); }
  .rail-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 2px; }
  .rail-src { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .flag { font-size: 9px; font-weight: 800; letter-spacing: 0.08em; color: #fff; background: var(--down); padding: 1px 5px; }
  .rail-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; }

  /* ---------- footer ---------- */
  .foot { background: var(--dark); color: #9aa0ab; margin-top: var(--gap); }
  .foot-in { max-width: 1320px; margin: 0 auto; padding: 22px var(--pad); display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .foot-brand { font-weight: 800; color: #e8e9ec; letter-spacing: -0.01em; }
  .foot-note { font-family: var(--mono); font-size: 10px; }

  /* ---------- markets view: heatmap ---------- */
  .markets-view { padding-bottom: var(--gap); }
  .hm-wrap { padding-bottom: var(--gap); border-bottom: 1px solid var(--rule); }
  .hm-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
  .seg { display: flex; gap: 0; border: 1px solid var(--rule); }
  .seg-btn { appearance: none; border: 0; background: var(--paper); color: var(--ink-2); font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 6px 13px; cursor: pointer; border-right: 1px solid var(--rule); }
  .seg-btn:last-child { border-right: 0; }
  .seg-btn:hover { background: var(--paper-2); }
  .seg-btn.is-on { background: var(--dark); color: #fff; }
  .hm-box { position: relative; width: 100%; background: var(--dark); overflow: hidden; }
  .hm-sector { position: absolute; border: 1px solid var(--dark); }
  .hm-sector-label { position: absolute; top: 1px; left: 5px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; color: #9aa0ab; white-space: nowrap; overflow: hidden; max-width: 95%; z-index: 2; }
  .hm-tile { position: absolute; appearance: none; border: 1px solid rgba(10,12,16,0.55); margin: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; overflow: hidden; font-family: var(--sans); }
  .hm-tile:hover { filter: brightness(1.18); z-index: 3; outline: 1px solid #fff; }
  .hm-sym { font-weight: 800; color: rgba(255,255,255,0.95); letter-spacing: 0.01em; line-height: 1; }
  .hm-chg { font-family: var(--mono); font-weight: 500; color: rgba(255,255,255,0.78); line-height: 1; }
  .hm-tip { position: absolute; z-index: 5; width: 178px; background: #fff; border: 1px solid var(--ink); box-shadow: 4px 4px 0 rgba(18,20,25,0.18); padding: 9px 11px; pointer-events: none; }
  .hm-tip-head { display: flex; gap: 7px; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 5px; margin-bottom: 5px; }
  .hm-tip-head b { font-size: 13px; }
  .hm-tip-head span { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hm-tip-row { display: flex; justify-content: space-between; font-size: 11px; padding: 1.5px 0; color: var(--ink-3); }
  .hm-tip-row b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
  .hm-legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; }
  .hm-leg-swatch { width: 26px; height: 10px; }
  .hm-leg-lab { font-family: var(--mono); font-size: 10px; color: var(--ink-3); padding: 0 4px; }

  /* ---------- markets view: movers + sector bars ---------- */
  .mk-duo { display: grid; grid-template-columns: 7fr 5fr; gap: calc(var(--gap) + 10px); padding: var(--gap) 0; border-bottom: 1px solid var(--rule); }
  .mk-duo .chart { border-top: 1px solid var(--ink); padding-top: 12px; }
  .mv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .mv-title { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--ink-3); margin: 0 0 4px; }
  .mv-row { appearance: none; background: none; border: 0; border-bottom: 1px solid var(--rule-2); width: 100%; display: grid; grid-template-columns: 52px 1fr auto auto; gap: 10px; align-items: baseline; padding: 7px 0; font-family: var(--sans); font-size: 12.5px; cursor: pointer; text-align: left; }
  .mv-row:hover .mv-sym { color: var(--accent); }
  .mv-sym { font-weight: 800; }
  .mv-name { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .mv-px, .mv-chg { font-family: var(--mono); font-size: 12px; }
  .mv-chg { font-weight: 600; }
  .sb-rows { display: flex; flex-direction: column; gap: 7px; }
  .sb-row { display: grid; grid-template-columns: 128px 1fr 56px; gap: 10px; align-items: center; }
  .sb-name { font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-track { position: relative; height: 13px; background: var(--paper-2); }
  .sb-zero { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink-3); }
  .sb-bar { position: absolute; top: 0; bottom: 0; }
  .is-up-bg { background: var(--up); } .is-down-bg { background: var(--down); }
  .sb-val { font-family: var(--mono); font-size: 11px; font-weight: 600; text-align: right; }

  /* ---------- screener ---------- */
  .scr { padding: var(--gap) 0 0; }
  .scr-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
  .scr-filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .scr-q { font-family: var(--sans); font-size: 12.5px; padding: 7px 10px; border: 1px solid var(--rule); background: #fff; width: 170px; }
  .scr-q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .scr-filter { display: flex; flex-direction: column; gap: 3px; }
  .scr-filter span { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .scr-filter select { font-family: var(--sans); font-size: 12px; padding: 6px 8px; border: 1px solid var(--rule); background: #fff; cursor: pointer; }
  .scr-reset { appearance: none; border: 0; background: none; font-family: var(--sans); font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; padding: 7px 4px; }
  .scr-tablewrap { overflow-x: auto; border-top: 1px solid var(--ink); }
  .scr-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .scr-table th { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
  .scr-table th.is-num, .scr-table td.is-num { text-align: right; }
  .scr-sort { appearance: none; border: 0; background: none; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 0; }
  .scr-sort:hover { color: var(--ink); }
  .scr-arrow { font-size: 8px; margin-left: 3px; color: var(--accent); }
  .scr-table td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
  .scr-table td.is-num { font-family: var(--mono); font-size: 12px; }
  .scr-table tbody tr { cursor: pointer; }
  .scr-table tbody tr:hover { background: var(--paper-2); }
  .scr-sym { font-weight: 800; }
  .scr-name { color: var(--ink-2); max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  .scr-sector { color: var(--ink-3); font-size: 11.5px; }
  .scr-spark { display: block; width: 100px; height: 28px; }
  .scr-empty { text-align: center; color: var(--ink-3); padding: 28px 0 !important; font-family: var(--serif); font-style: italic; }

  /* ---------- ticker drawer ---------- */
  .drawer-scrim { position: fixed; inset: 0; background: rgba(18,20,25,0.42); z-index: 60; display: flex; justify-content: flex-end; }
  .drawer { width: min(440px, 94vw); background: var(--paper); height: 100%; overflow-y: auto; padding: 22px 24px; box-shadow: -6px 0 24px rgba(18,20,25,0.25); border-left: 3px solid var(--dark); }
  .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .drawer-sym { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--accent); margin: 0 0 3px; }
  .drawer-sector { color: var(--ink-3); font-weight: 400; margin-left: 6px; text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.1em; }
  .drawer-name { font-family: var(--hed-font); font-weight: var(--hed-weight); font-size: 24px; letter-spacing: -0.015em; margin: 0; line-height: 1.1; }
  .drawer-x { appearance: none; border: 1px solid var(--rule); background: #fff; font-size: 18px; line-height: 1; width: 32px; height: 32px; cursor: pointer; color: var(--ink-2); flex: none; }
  .drawer-x:hover { border-color: var(--ink); color: var(--ink); }
  .drawer-px-row { display: flex; align-items: baseline; gap: 12px; margin: 14px 0 8px; }
