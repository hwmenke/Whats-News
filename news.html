<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News – Whats-News</title>
  <meta name="description" content="Latest news for your watchlist symbols from Yahoo Finance." />
  <link rel="stylesheet" href="styles/main.css" />
  <style>
    /* All selectors are wn- prefixed so they never merge with the dashboard
       news panel rules (.news-*, .empty-state, .spinner) in main.css. */
    .wn-app {
      display: grid;
      grid-template-rows: var(--topbar-h) 1fr;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-base);
    }

    .wn-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .wn-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
      text-decoration: none;
    }

    .wn-logo-mark {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), var(--purple));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .wn-nav { display: flex; gap: 8px; align-items: center; }

    .wn-nav a {
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s, background 0.15s;
    }
    .wn-nav a:hover { color: var(--text-primary); background: var(--bg-hover); }
    .wn-nav a.active { color: var(--accent-bright); background: var(--accent-glow); }

    .wn-spacer { flex: 1; }

    .wn-main { overflow-y: auto; padding: 24px 24px 48px; }

    .wn-news-container { max-width: 900px; margin: 0 auto; }

    .wn-news-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .wn-news-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .wn-news-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      align-items: center;
    }

    .wn-news-meta .wn-sep { color: var(--text-dim); }

    .wn-btn {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s;
    }
    .wn-btn:hover:not(:disabled) { border-color: var(--border-accent); background: var(--bg-hover); }
    .wn-btn:disabled { opacity: 0.6; cursor: default; }
    .wn-btn:focus-visible,
    .wn-chip:focus-visible,
    .wn-seg button:focus-visible,
    .wn-search input:focus-visible {
      outline: 2px solid var(--accent-bright);
      outline-offset: 1px;
    }

    .wn-controls {
      position: sticky;
      top: -24px;
      z-index: 20;
      margin: 0 -24px 16px;
      padding: 12px 24px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wn-controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .wn-search { flex: 1 1 220px; min-width: 0; }

    .wn-search input {
      width: 100%;
      font: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
    }
    .wn-search input::placeholder { color: var(--text-dim); }

    .wn-seg {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-elevated);
    }
    .wn-seg button {
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: 0;
      border-right: 1px solid var(--border);
      padding: 7px 12px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .wn-seg button:last-child { border-right: 0; }
    .wn-seg button:hover { color: var(--text-primary); background: var(--bg-hover); }
    .wn-seg button[aria-pressed="true"] { color: var(--accent-bright); background: var(--accent-glow); }

    .wn-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .wn-chip-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-right: 2px;
    }

    .wn-chip {
      font: inherit;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .wn-chip:hover { color: var(--text-primary); border-color: var(--border-accent); }
    .wn-chip[aria-pressed="true"] {
      color: var(--accent-bright);
      background: var(--accent-glow);
      border-color: var(--accent);
    }
    .wn-chip.wn-chip-tag { font-family: var(--font-main); font-weight: 500; text-transform: capitalize; }
    .wn-chip.wn-chip-clear { border-style: dashed; }

    .wn-status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .wn-status[hidden] { display: none; }
    .wn-status.is-loading { border-color: var(--accent); }
    .wn-status.is-error { border-color: var(--red); }
    .wn-status.is-warn { border-color: var(--yellow); }

    .wn-spinner {
      width: 14px;
      height: 14px;
      flex: none;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: wn-spin 0.8s linear infinite;
    }
    .wn-status:not(.is-loading) .wn-spinner { display: none; }
    @keyframes wn-spin { to { transform: rotate(360deg); } }

    .wn-news-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      list-style: none;
    }

    .wn-article {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      transition: border-color 0.15s;
    }
    .wn-article:hover { border-color: var(--border-accent); }

    .wn-article-top {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }

    .wn-symbol {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-bright);
      background: var(--accent-glow);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: background 0.15s;
    }
    .wn-symbol:hover { background: rgba(59, 130, 246, 0.32); }

    .wn-tag {
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      text-transform: capitalize;
    }

    .wn-article-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .wn-article-title a { color: inherit; text-decoration: none; transition: color 0.15s; }
    .wn-article-title a:hover { color: var(--accent-bright); }

    .wn-article-summary {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .wn-article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: 12px;
      color: var(--text-dim);
      align-items: center;
    }
    .wn-article-meta a { color: inherit; text-decoration: none; }
    .wn-article-meta a:hover { color: var(--text-muted); }
    .wn-article-meta time { font-family: var(--font-mono); }

    .wn-skeleton {
      height: 112px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-hover) 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: wn-shimmer 1.4s ease-in-out infinite;
    }
    @keyframes wn-shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    .wn-empty {
      text-align: center;
      padding: 56px 20px;
      color: var(--text-muted);
    }
    .wn-empty h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .wn-empty p { font-size: 14px; line-height: 1.6; }
    .wn-empty a { color: var(--accent-bright); }
    .wn-empty .wn-btn { margin-top: 14px; }

    .wn-error-detail {
      margin-top: 16px;
      padding: 12px;
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--red);
      text-align: left;
      overflow-wrap: anywhere;
    }

    .wn-visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .wn-main { padding: 16px 14px 40px; }
      .wn-controls { top: -16px; margin: 0 -14px 14px; padding: 10px 14px; }
      .wn-news-header h1 { font-size: 22px; }
      .wn-topbar { padding: 0 10px; gap: 8px; }
      .wn-logo-text { display: none; }
      .wn-article { padding: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wn-spinner, .wn-skeleton { animation: none; }
    }
  </style>
</head>
<body>

<div class="wn-app">
  <header class="wn-topbar">
    <a class="wn-logo" href="/" aria-label="Whats-News dashboard">
      <span class="wn-logo-mark" aria-hidden="true">N</span>
      <span class="wn-logo-text">Whats-News</span>
    </a>

    <nav class="wn-nav" aria-label="Primary">
      <a href="/">Dashboard</a>
      <a href="/news" class="active" aria-current="page">Watchlist news</a>
    </nav>

    <div class="wn-spacer"></div>

    <div id="status-dot" class="status-dot" title="Checking…" role="img" aria-label="Connection status: checking"></div>
  </header>

  <main class="wn-main" id="wn-main">
    <div class="wn-news-container">
      <div class="wn-news-header">
        <div>
          <h1>Watchlist News</h1>
          <div class="wn-news-meta">
            <span id="wn-count">Loading…</span>
            <span class="wn-sep" aria-hidden="true">•</span>
            <span id="wn-source">Source: Yahoo Finance</span>
            <span class="wn-sep" aria-hidden="true">•</span>
            <span id="wn-updated">Not yet updated</span>
          </div>
        </div>
        <button type="button" id="wn-refresh" class="wn-btn">Refresh</button>
      </div>

      <section class="wn-controls" aria-label="Filter news">
        <div class="wn-controls-row">
          <div class="wn-search">
            <label class="wn-visually-hidden" for="wn-search-input">Search headlines, summaries and providers</label>
            <input id="wn-search-input" type="search" placeholder="Search headlines, summaries, providers" autocomplete="off" />
          </div>
          <div class="wn-seg" role="group" aria-label="Time window" id="wn-window">
            <button type="button" data-window="all" aria-pressed="true">All</button>
            <button type="button" data-window="24h" aria-pressed="false">24h</button>
            <button type="button" data-window="7d" aria-pressed="false">7d</button>
          </div>
        </div>
        <div class="wn-chip-row" id="wn-symbol-chips" role="group" aria-label="Filter by symbol" hidden></div>
        <div class="wn-chip-row" id="wn-tag-chips" role="group" aria-label="Filter by event tag" hidden></div>
      </section>

      <div id="wn-status" class="wn-status" role="status" aria-live="polite" hidden>
        <div class="wn-spinner" aria-hidden="true"></div>
        <span id="wn-status-text"></span>
      </div>

      <ul id="wn-news-list" class="wn-news-list" aria-busy="false"></ul>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  const API_BASE = window.location.origin;
  const FILTER_KEY = 'whats-news-news-filters';
  const AUTO_REFRESH_MS = 5 * 60 * 1000;
  const TICK_MS = 60 * 1000;
  const WINDOW_MS = { '24h': 24 * 3600 * 1000, '7d': 7 * 24 * 3600 * 1000 };
  const SYMBOL_RE = /^[A-Za-z0-9.\-^=]{1,15}$/;

  const $ = (id) => document.getElementById(id);
  const els = {
    list: $('wn-news-list'),
    count: $('wn-count'),
    source: $('wn-source'),
    updated: $('wn-updated'),
    refresh: $('wn-refresh'),
    search: $('wn-search-input'),
    windowGroup: $('wn-window'),
    symbolChips: $('wn-symbol-chips'),
    tagChips: $('wn-tag-chips'),
    status: $('wn-status'),
    statusText: $('wn-status-text'),
    dot: $('status-dot'),
  };

  const state = {
    articles: [],
    meta: null,
    loading: false,
    lastLoadedAt: null,
    cached: false,
    filters: { q: '', symbols: [], tags: [], window: 'all' },
  };

  /* ── DOM helpers (no innerHTML anywhere) ─────────────────── */

  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v === true ? '' : String(v));
      }
    }
    for (const child of children || []) {
      if (child == null) continue;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }

  function safeUrl(raw) {
    if (!raw || typeof raw !== 'string') return null;
    try {
      const u = new URL(raw, window.location.href);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
    } catch (e) {
      return null;
    }
  }

  function stripHtml(html) {
    if (!html) return '';
    const doc = new DOMParser().parseFromString(String(html), 'text/html');
    return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function plural(n, word) {
    return `${n} ${word}${n === 1 ? '' : 's'}`;
  }

  function sourceLabel(data) {
    const feeds = Array.isArray(data && data.feeds) ? data.feeds : [];
    const base = (data && data.source) || 'Yahoo Finance';
    if (feeds.includes('yahoo_rss') && feeds.includes('yfinance')) {
      return `Source: ${base} (RSS fallback)`;
    }
    if (feeds.length === 1 && feeds[0] === 'yahoo_rss') {
      return `Source: ${base} RSS`;
    }
    return `Source: ${base}`;
  }

  /* ── Time ─────────────────────────────────────────────────── */

  function parseTime(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    return isNaN(d.getTime()) ? null : d;
  }

  function formatTime(iso) {
    const date = parseTime(iso);
    if (!date) return iso ? String(iso).split('T')[0] : 'Unknown time';
    const now = new Date();
    const diffMs = now - date;
    if (diffMs < 0) return 'Just now';
    const mins = Math.floor(diffMs / 60000);
    const hours = Math.floor(diffMs / 3600000);
    const days = Math.floor(diffMs / 86400000);
    if (mins < 1) return 'Just now';
    if (mins < 60) return `${mins}m ago`;
    if (hours < 24) return `${hours}h ago`;
    if (days < 7) return `${days}d ago`;
    return date.toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined,
    });
  }

  /* ── Filters: persistence + URL ───────────────────────────── */

  function cleanList(v, re) {
    if (!Array.isArray(v)) return [];
    return [...new Set(v.filter((s) => typeof s === 'string' && (!re || re.test(s))))];
  }

  function loadFilters() {
    try {
      const saved = JSON.parse(localStorage.getItem(FILTER_KEY) || 'null');
      if (saved && typeof saved === 'object') {
        state.filters.q = typeof saved.q === 'string' ? saved.q : '';
        state.filters.symbols = cleanList(saved.symbols, SYMBOL_RE).map((s) => s.toUpperCase());
        state.filters.tags = cleanList(saved.tags);
        state.filters.window = ['all', '24h', '7d'].includes(saved.window) ? saved.window : 'all';
      }
    } catch (e) { /* ignore corrupt or unavailable storage */ }

    const qp = new URLSearchParams(window.location.search).get('symbol');
    if (qp && SYMBOL_RE.test(qp.trim())) {
      state.filters.symbols = [qp.trim().toUpperCase()];
    }
  }

  function saveFilters() {
    try {
      localStorage.setItem(FILTER_KEY, JSON.stringify(state.filters));
    } catch (e) { /* storage may be unavailable */ }
  }

  /* ── Article normalisation ────────────────────────────────── */

  function normalizeArticle(a) {
    if (!a || typeof a !== 'object') return null;
    let symbols = [];
    if (Array.isArray(a.symbols)) symbols = a.symbols;
    else if (a.symbol) symbols = [a.symbol];
    symbols = [...new Set(symbols
      .filter((s) => typeof s === 'string' && SYMBOL_RE.test(s.trim()))
      .map((s) => s.trim().toUpperCase()))];
    const tags = Array.isArray(a.tags)
      ? [...new Set(a.tags.filter((t) => typeof t === 'string' && t.trim()).map((t) => t.trim()))]
      : [];
    const title = a.title == null ? '' : String(a.title);
    const summary = stripHtml(a.summary);
    const provider = a.provider == null ? '' : String(a.provider);
    return {
      symbols,
      tags,
      title: title || 'Untitled',
      url: safeUrl(a.url),
      summary,
      provider,
      providerUrl: safeUrl(a.provider_url),
      publishTime: a.publish_time || null,
      publishDate: parseTime(a.publish_time),
    };
  }

  function sortedArticles(list) {
    return list
      .map((a, i) => [a, i])
      .sort((x, y) => {
        const tx = x[0].publishDate ? x[0].publishDate.getTime() : -Infinity;
        const ty = y[0].publishDate ? y[0].publishDate.getTime() : -Infinity;
        return ty - tx || x[1] - y[1];
      })
      .map((p) => p[0]);
  }

  function filteredArticles() {
    const { q, symbols, tags, window: win } = state.filters;
    const needle = q.trim().toLowerCase();
    const cutoff = WINDOW_MS[win] ? Date.now() - WINDOW_MS[win] : null;
    return state.articles.filter((a) => {
      if (symbols.length && !a.symbols.some((s) => symbols.includes(s))) return false;
      if (tags.length && !a.tags.some((t) => tags.includes(t))) return false;
      if (cutoff != null && (!a.publishDate || a.publishDate.getTime() < cutoff)) return false;
      if (needle) {
        const hay = `${a.title} ${a.summary} ${a.provider}`.toLowerCase();
        if (!hay.includes(needle)) return false;
      }
      return true;
    });
  }

  /* ── Rendering ────────────────────────────────────────────── */

  function renderArticle(a) {
    const top = el('div', { class: 'wn-article-top' });
    for (const sym of a.symbols) {
      top.appendChild(el('a', {
        class: 'wn-symbol',
        href: `/?symbol=${encodeURIComponent(sym)}&tab=news`,
        title: `Open ${sym} on the dashboard`,
        text: sym,
      }));
    }
    for (const tag of a.tags) top.appendChild(el('span', { class: 'wn-tag', text: tag }));

    const titleInner = a.url
      ? el('a', { href: a.url, target: '_blank', rel: 'noopener noreferrer', text: a.title })
      : document.createTextNode(a.title);

    const meta = el('div', { class: 'wn-article-meta' });
    if (a.provider) {
      const providerNode = a.providerUrl
        ? el('a', { href: a.providerUrl, target: '_blank', rel: 'noopener noreferrer', text: a.provider })
        : document.createTextNode(a.provider);
      meta.appendChild(el('span', null, ['via ', providerNode]));
    }
    meta.appendChild(el('time', {
      datetime: a.publishDate ? a.publishDate.toISOString() : null,
      'data-iso': a.publishDate ? a.publishDate.toISOString() : null,
      title: a.publishDate ? a.publishDate.toLocaleString() : null,
      text: formatTime(a.publishTime),
    }));

    const summary = a.summary.length > 220 ? `${a.summary.slice(0, 220).trimEnd()}…` : a.summary;

    return el('li', null, [
      el('article', { class: 'wn-article' }, [
        top.childNodes.length ? top : null,
        el('h2', { class: 'wn-article-title' }, [titleInner]),
        summary ? el('p', { class: 'wn-article-summary', text: summary }) : null,
        meta,
      ]),
    ]);
  }

  function renderEmpty(title, message, opts) {
    const o = opts || {};
    const box = el('div', { class: 'wn-empty' }, [
      el('h2', { text: title }),
      el('p', { text: message }),
    ]);
    if (o.linkDashboard) {
      box.appendChild(el('p', null, [el('a', { href: '/', text: '← Add symbols on the Dashboard' })]));
    }
    if (o.clearFilters) {
      const btn = el('button', { type: 'button', class: 'wn-btn', text: 'Clear filters' });
      btn.addEventListener('click', clearFilters);
      box.appendChild(btn);
    }
    if (o.detail) box.appendChild(el('div', { class: 'wn-error-detail', text: String(o.detail) }));
    return el('li', null, [box]);
  }

  function renderSkeleton() {
    els.list.replaceChildren(...Array.from({ length: 4 }, () =>
      el('li', { 'aria-hidden': 'true' }, [el('div', { class: 'wn-skeleton' })])));
  }

  function hasActiveFilters() {
    const f = state.filters;
    return !!(f.q.trim() || f.symbols.length || f.tags.length || f.window !== 'all');
  }

  function renderChips() {
    const symCounts = new Map();
    const tagCounts = new Map();
    for (const a of state.articles) {
      for (const s of a.symbols) symCounts.set(s, (symCounts.get(s) || 0) + 1);
      for (const t of a.tags) tagCounts.set(t, (tagCounts.get(t) || 0) + 1);
    }
    for (const s of state.filters.symbols) if (!symCounts.has(s)) symCounts.set(s, 0);
    for (const t of state.filters.tags) if (!tagCounts.has(t)) tagCounts.set(t, 0);

    const build = (container, label, counts, selected, kind) => {
      container.replaceChildren();
      container.hidden = counts.size === 0;
      if (counts.size === 0) return;
      container.appendChild(el('span', { class: 'wn-chip-label', text: label }));
      const keys = [...counts.keys()].sort((a, b) => (counts.get(b) - counts.get(a)) || a.localeCompare(b));
      for (const key of keys) {
        const chip = el('button', {
          type: 'button',
          class: kind === 'tag' ? 'wn-chip wn-chip-tag' : 'wn-chip',
          'aria-pressed': selected.includes(key) ? 'true' : 'false',
          'data-kind': kind,
          'data-value': key,
          text: key,
        });
        container.appendChild(chip);
      }
      if (selected.length) {
        container.appendChild(el('button', {
          type: 'button',
          class: 'wn-chip wn-chip-clear',
          'data-kind': kind,
          'data-clear': 'true',
          text: 'Clear',
        }));
      }
    };

    build(els.symbolChips, 'Symbols', symCounts, state.filters.symbols, 'symbol');
    build(els.tagChips, 'Tags', tagCounts, state.filters.tags, 'tag');
  }

  function syncControls() {
    if (els.search.value !== state.filters.q) els.search.value = state.filters.q;
    for (const btn of els.windowGroup.querySelectorAll('button')) {
      btn.setAttribute('aria-pressed', btn.dataset.window === state.filters.window ? 'true' : 'false');
    }
  }

  function renderList() {
    renderChips();
    syncControls();

    if (!state.meta) return;

    const visible = filteredArticles();
    const total = state.articles.length;
    const symbolCount = state.meta.symbol_count;

    if (total === 0) {
      const emptyWatchlist = !symbolCount;
      const throttled = !!state.meta.rate_limited;
      let detail;
      if (emptyWatchlist) {
        detail = 'Your watchlist is empty. Add tickers on the Dashboard first.';
      } else if (throttled) {
        detail = `Yahoo is rate-limiting news for ${plural(symbolCount, 'symbol')}. Try Refresh again in a minute.`;
      } else {
        detail = `No headlines right now for ${plural(symbolCount, 'symbol')}. Yahoo may be throttling — try Refresh in a minute.`;
      }
      els.list.replaceChildren(renderEmpty(
        throttled ? 'Yahoo is rate-limiting' : 'No news available',
        detail,
        { linkDashboard: emptyWatchlist }
      ));
      els.count.textContent = `${plural(symbolCount || 0, 'symbol')}, 0 articles`;
      return;
    }

    if (visible.length === 0) {
      els.list.replaceChildren(renderEmpty(
        'No matching articles',
        'Nothing matches your current filters.',
        { clearFilters: hasActiveFilters() }
      ));
    } else {
      els.list.replaceChildren(...visible.map(renderArticle));
    }

    let label = visible.length === total
      ? plural(total, 'article')
      : `${visible.length} of ${plural(total, 'article')}`;
    if (symbolCount) label += ` · ${plural(symbolCount, 'symbol')}`;
    if (state.meta.errors && state.meta.errors.length) {
      label += ` · ${plural(state.meta.errors.length, 'fetch issue')}`;
    }
    els.count.textContent = label;
  }

  /* ── Status UI ────────────────────────────────────────────── */

  function showStatus(message, type) {
    els.status.hidden = false;
    els.status.className = `wn-status is-${type || 'loading'}`;
    els.statusText.textContent = message;
  }

  function hideStatus() {
    els.status.hidden = true;
    els.statusText.textContent = '';
  }

  function setDot(kind) {
    els.dot.classList.remove('ok', 'bad');
    const labels = {
      ok: ['Connected', 'Connected'],
      bad: ['Offline', 'Offline'],
      warn: ['Server reported an error', 'Server error'],
    };
    const [title, aria] = labels[kind] || ['Checking…', 'Checking'];
    if (kind === 'ok' || kind === 'bad') els.dot.classList.add(kind);
    els.dot.title = title;
    els.dot.setAttribute('aria-label', `Connection status: ${aria.toLowerCase()}`);
  }

  function updateFreshness() {
    if (!state.lastLoadedAt) {
      els.updated.textContent = 'Not yet updated';
      return;
    }
    const rel = formatTime(state.lastLoadedAt.toISOString());
    els.updated.textContent = `Last updated ${rel === 'Just now' ? 'just now' : rel}${state.cached ? ' (cached)' : ''}`;
    els.updated.title = state.lastLoadedAt.toLocaleString();
  }

  function tickRelativeTimes() {
    for (const t of els.list.querySelectorAll('time[data-iso]')) {
      t.textContent = formatTime(t.dataset.iso);
    }
    updateFreshness();
  }

  /* ── Loading ──────────────────────────────────────────────── */

  async function loadNews({ refresh = false, silent = false } = {}) {
    if (state.loading) return;
    state.loading = true;
    els.refresh.disabled = true;
    els.refresh.textContent = refresh ? 'Refreshing…' : 'Refresh';
    els.list.setAttribute('aria-busy', 'true');

    const hadData = state.meta !== null;
    if (!hadData) renderSkeleton();
    if (!silent) showStatus(refresh ? 'Refreshing news from Yahoo Finance…' : 'Fetching news from Yahoo Finance…', 'loading');

    try {
      const url = `${API_BASE}/api/news${refresh ? '?refresh=1' : ''}`;
      const response = await fetch(url, { headers: { Accept: 'application/json' } });

      let data = null;
      try { data = await response.json(); } catch (e) { /* non-JSON body */ }

      if (!response.ok) {
        const reason = (data && data.error) || `HTTP ${response.status}`;
        throw new Error(String(reason));
      }
      if (!data || typeof data !== 'object') throw new Error('Invalid response from server');

      if (data.error) {
        setDot('warn');
        hideStatus();
        if (!hadData) {
          els.list.replaceChildren(renderEmpty('Failed to fetch news', 'The server could not load news right now.', { detail: data.error }));
          els.count.textContent = 'Error';
        } else {
          showStatus(`Refresh failed: ${data.error}. Showing previous results.`, 'error');
        }
        return;
      }

      state.meta = data;
      state.articles = sortedArticles((Array.isArray(data.articles) ? data.articles : []).map(normalizeArticle).filter(Boolean));
      if (typeof data.symbol_count !== 'number') {
        data.symbol_count = new Set(state.articles.flatMap((a) => a.symbols)).size;
      }
      state.cached = data.cached === true;
      state.lastLoadedAt = parseTime(data.fetched_at || data.updated_at) || new Date();
      if (els.source) els.source.textContent = sourceLabel(data);
      setDot('ok');

      renderList();
      updateFreshness();

      if (Array.isArray(data.errors) && data.errors.length) {
        const failed = data.errors.filter((e) => e && !e.stale).map((e) => e.symbol || '').filter(Boolean);
        const stale = data.errors.filter((e) => e && e.stale).map((e) => e.symbol || '').filter(Boolean);
        const parts = [];
        if (failed.length) parts.push(`${failed.join(', ')} failed`);
        if (stale.length) parts.push(`${stale.join(', ')} showing cached headlines`);
        showStatus(`Loaded with warnings${parts.length ? `: ${parts.join('; ')}` : ''}.`, 'warn');
      } else {
        hideStatus();
      }
    } catch (error) {
      setDot('bad');
      console.error('Failed to load news:', error);
      hideStatus();
      if (!hadData) {
        els.list.replaceChildren(renderEmpty(
          'Could not load news',
          'Could not reach the Whats-News server. Is it running?',
          { linkDashboard: true, detail: error.message }
        ));
        els.count.textContent = 'Error';
      } else {
        showStatus(`Refresh failed: ${error.message}. Showing previous results.`, 'error');
      }
    } finally {
      state.loading = false;
      els.refresh.disabled = false;
      els.refresh.textContent = 'Refresh';
      els.list.setAttribute('aria-busy', 'false');
    }
  }

  /* ── Events ───────────────────────────────────────────────── */

  function clearFilters() {
    state.filters = { q: '', symbols: [], tags: [], window: 'all' };
    saveFilters();
    renderList();
  }

  function toggle(arr, value) {
    const i = arr.indexOf(value);
    if (i === -1) arr.push(value);
    else arr.splice(i, 1);
  }

  function onChipClick(e) {
    const btn = e.target.closest('button[data-kind]');
    if (!btn) return;
    const key = btn.dataset.kind === 'tag' ? 'tags' : 'symbols';
    if (btn.dataset.clear) state.filters[key] = [];
    else toggle(state.filters[key], btn.dataset.value);
    saveFilters();
    renderList();
  }

  els.symbolChips.addEventListener('click', onChipClick);
  els.tagChips.addEventListener('click', onChipClick);

  els.windowGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-window]');
    if (!btn) return;
    state.filters.window = btn.dataset.window;
    saveFilters();
    renderList();
  });

  els.search.addEventListener('input', () => {
    state.filters.q = els.search.value;
    saveFilters();
    renderList();
  });

  els.refresh.addEventListener('click', () => loadNews({ refresh: true }));

  setInterval(tickRelativeTimes, TICK_MS);

  setInterval(() => {
    if (document.visibilityState === 'visible') loadNews({ silent: true });
  }, AUTO_REFRESH_MS);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    tickRelativeTimes();
    if (state.lastLoadedAt && Date.now() - state.lastLoadedAt.getTime() > AUTO_REFRESH_MS) {
      loadNews({ silent: true });
    }
  });

  loadFilters();
  syncControls();
  loadNews();
})();
</script>

</body>
</html>
