[project]
name = "capstruct"
version = "0.1.0"
description = "SEC capital structure & liquidity extractor"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "typer>=0.12", "pandas>=2.0"]

[project.scripts]
capstruct = "capstruct.cli:app"

[tool.setuptools.packages.find]
include = ["capstruct*"]
